name: PR Checks

on:
  pull_request:
    branches: [main, master]
    paths:
      - '**.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.cfg'
      - 'pytest.ini'
      - '.github/workflows/*.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "radar-core @ git+https://github.com/ai-frendly-datahub/radar-core.git@main"
          pip install -r requirements.txt
          pip install black ruff mypy pytest pytest-cov

      - name: Verify pyproject.toml installability
        run: pip install -e .

      - name: Run Black (code formatting check)
        run: black --check --line-length=100 .

      - name: Run Ruff (linting)
        run: ruff check . --line-length=100

      - name: Run MyPy (type checking)
        run: mypy eventradar main.py scripts --strict --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          set -o pipefail
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing --tb=short | tee coverage.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Comment PR with coverage
        if: always()
        uses: py-cov-action/python-coverage-comment-action@v3
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60

      - name: Check coverage threshold
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          minimum = 80.0
          root = ET.parse("coverage.xml").getroot()
          coverage = float(root.attrib["line-rate"]) * 100
          if coverage < minimum:
              sys.exit(f"Coverage is {coverage:.2f}%, minimum required is {minimum:.0f}%")
          print(f"Coverage is {coverage:.2f}%, meets minimum requirement")
          PY
