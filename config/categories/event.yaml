category_name: event
display_name: 행사/이벤트 레이더
data_quality:
  priority: P1
  primary_motion: intelligence
  weakest_dimension: operational_depth
  quality_outputs:
    freshness_report: reports/event_quality.json
    dated_freshness_report_pattern: reports/event_YYYYMMDD_quality.json
    tracked_event_models:
    - official_event_calendar
    - ticket_availability
    - venue_calendar
    - exhibitor_sponsor_signal
  event_models:
    official_event_calendar:
      date_fields:
      - event_date
      - event_start_date
      - event_end_date
      required_fields:
      - event_title
      - venue_id
      - source_url
    ticket_availability:
      date_fields:
      - ticket_open_date
      - observed_at
      required_fields:
      - event_occurrence_id
      - availability_status
      - source_url
    venue_calendar:
      date_fields:
      - event_date
      - collected_at
      required_fields:
      - venue_id
      - event_occurrence_id
      - source_url
    exhibitor_sponsor_signal:
      date_fields:
      - published_date
      - collected_at
      required_fields:
      - event_occurrence_id
      - organization_name
      - signal_type
  canonical_keys:
    event_occurrence:
    - event_title
    - venue_id
    - event_date
    - city
    - online_flag
    venue:
    - venue_name
    - city
    - country
  freshness_sla:
    official_event_calendar_days: 3
    ticket_availability_hours: 24
    venue_calendar_days: 3
    exhibitor_sponsor_signal_days: 7
  quality_gates:
  - 행사일, 티켓 오픈일, 수집일을 별도 필드로 유지한다
  - 동일 행사의 지역, 회차, 온라인 여부를 event_occurrence_id로 분리한다
  - 미디어 소개 기사와 공식 등록/티켓 source를 분리한다
  - 참가사/스폰서 신호는 리드 발굴용 보조 필드로만 병합한다
  - 오류/서비스 지연 페이지는 리포트와 품질 이벤트에서 제외한다
  - 일반 문화/연예 뉴스는 행사·공연·전시 신호가 있을 때만 리포트에 반영한다
source_backlog:
  operational_candidates:
  - id: ticketmaster_discovery_api
    name: Ticketmaster Discovery API
    signal_type: ticket_availability
    activation_gate: API key, quota, event id mapping, and ticket status field validation
  - id: seoul_open_event_api
    name: Seoul open culture event API
    signal_type: official_event_calendar
    activation_gate: data.go.kr/API access, venue id normalization, and date timezone validation
  - id: venue_calendar_pages
    name: Major venue calendar pages
    signal_type: venue_calendar
    activation_gate: parser stability, duplicate occurrence handling, and source URL evidence
  - id: exhibitor_sponsor_lists
    name: Expo exhibitor and sponsor lists
    signal_type: exhibitor_sponsor_signal
    activation_gate: ToS review, organization canonicalization, and event occurrence mapping
